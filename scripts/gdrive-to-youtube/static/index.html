<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive → YouTube</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 520px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icons {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 24px;
    }

    .logo h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .logo p {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 6px;
      margin-top: 20px;
    }

    label:first-of-type { margin-top: 0; }

    input {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      color: #e8e8e8;
      outline: none;
      transition: border-color .15s;
    }

    input:focus { border-color: #ff0000; }
    input::placeholder { color: #444; }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }

    button:hover:not(:disabled) { background: #cc0000; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .progress-wrap {
      margin-top: 24px;
      display: none;
    }

    .progress-wrap.visible { display: block; }

    .progress-bar-bg {
      background: #2a2a2a;
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #ff0000;
      border-radius: 99px;
      width: 0%;
      transition: width .4s ease;
    }

    .log {
      margin-top: 14px;
      font-size: 13px;
      color: #777;
      line-height: 1.6;
      max-height: 160px;
      overflow-y: auto;
    }

    .log-line { padding: 1px 0; }
    .log-line.latest { color: #ccc; }

    .result {
      margin-top: 20px;
      padding: 16px;
      background: #0d2416;
      border: 1px solid #1a4a2a;
      border-radius: 10px;
      display: none;
    }

    .result.visible { display: block; }

    .result p { font-size: 13px; color: #5a9; margin-bottom: 8px; }

    .result a {
      display: inline-block;
      background: #ff0000;
      color: #fff;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .result a:hover { background: #cc0000; }

    .error-box {
      margin-top: 20px;
      padding: 14px;
      background: #2a0d0d;
      border: 1px solid #4a1a1a;
      border-radius: 10px;
      font-size: 13px;
      color: #f87;
      display: none;
    }

    .error-box.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icons">🎬➜▶️</div>
      <div>
        <h1>Drive → YouTube</h1>
        <p>Sobe reuniões automaticamente</p>
      </div>
    </div>

    <label>Link do Google Drive</label>
    <input id="url" type="url" placeholder="https://drive.google.com/file/d/..." />

    <label>Título no YouTube</label>
    <input id="title" type="text" placeholder="Ex: Reunião ACIESC - Junho 2026" />

    <button id="btn" onclick="startUpload()">Enviar para o YouTube</button>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-bg">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="log" id="log"></div>
    </div>

    <div class="result" id="result">
      <p>✅ Upload concluído!</p>
      <a id="ytLink" href="#" target="_blank">Abrir no YouTube</a>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    function startUpload() {
      const url = document.getElementById("url").value.trim();
      const title = document.getElementById("title").value.trim();
      const btn = document.getElementById("btn");
      const progressWrap = document.getElementById("progressWrap");
      const progressBar = document.getElementById("progressBar");
      const log = document.getElementById("log");
      const result = document.getElementById("result");
      const errorBox = document.getElementById("errorBox");

      if (!url || !title) {
        alert("Preencha o link e o título.");
        return;
      }

      // reset
      btn.disabled = true;
      btn.textContent = "Enviando...";
      progressWrap.classList.add("visible");
      result.classList.remove("visible");
      errorBox.classList.remove("visible");
      log.innerHTML = "";
      progressBar.style.width = "0%";

      function addLog(msg, latest = false) {
        const prev = log.querySelector(".latest");
        if (prev) prev.classList.remove("latest");
        const line = document.createElement("div");
        line.className = "log-line" + (latest ? " latest" : "");
        line.textContent = msg;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
      }

      fetch("/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, title }),
      }).then(res => {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        function read() {
          reader.read().then(({ done, value }) => {
            if (done) return;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n\n");
            buffer = lines.pop();

            for (const line of lines) {
              if (!line.startsWith("data:")) continue;
              const data = JSON.parse(line.slice(5).trim());

              if (data.error) {
                errorBox.textContent = "Erro: " + data.error;
                errorBox.classList.add("visible");
                btn.disabled = false;
                btn.textContent = "Tentar novamente";
                return;
              }

              if (data.progress !== undefined) {
                progressBar.style.width = data.progress + "%";
              }

              const msg = data.message || "";
              if (msg.startsWith("DONE:")) {
                const ytUrl = msg.slice(5);
                result.classList.add("visible");
                document.getElementById("ytLink").href = ytUrl;
                addLog("✅ Pronto! Vídeo disponível no YouTube.");
                btn.disabled = false;
                btn.textContent = "Enviar outro vídeo";
                document.getElementById("url").value = "";
                document.getElementById("title").value = "";
              } else {
                addLog(msg, true);
              }
            }
            read();
          });
        }
        read();
      }).catch(err => {
        errorBox.textContent = "Erro de conexão: " + err.message;
        errorBox.classList.add("visible");
        btn.disabled = false;
        btn.textContent = "Tentar novamente";
      });
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") startUpload();
    });
  </script>
</body>
</html>
